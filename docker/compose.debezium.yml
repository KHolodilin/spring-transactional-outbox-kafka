# Debezium stack. Host ports do not overlap with servlet, reactive, or VT.
# Order 8096, stub 8097, Connect REST 8087, Postgres 5435, Kafka 19095, Grafana 3003.
# Observability matches the servlet stack: docker compose --profile observability up -d.
# notification-stub is built from the local Dockerfile. The released GHCR image cannot read order-payload.
name: outbox-debezium

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: outbox_debezium
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    ports:
      - "5435:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox_debezium"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "19095:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      - kafka
    network_mode: "service:kafka"
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka..."
        for i in $$(seq 1 30); do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic orders.events \
          --partitions 10 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic connect-configs \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic connect-offsets \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 \
          --create --if-not-exists \
          --topic connect-status \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=compact
        echo "Topic orders.events and Connect topics are ready"

  order-service-debezium:
    build:
      context: ../order-service-debezium
    ports:
      - "8096:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: outbox_debezium
      DB_USER: outbox
      DB_PASSWORD: outbox
      SERVER_PORT: "8086"
      SPRING_PROFILES_ACTIVE: dev
      LOG_JSON_PATH: /var/log/app
      DEPLOYMENT_ENV: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    volumes:
      - ../logs/debezium:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy

  notification-stub:
    build:
      context: ../notification-stub
    ports:
      - "8097:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: outbox_debezium
      DB_USER: outbox
      DB_PASSWORD: outbox
      KAFKA_BOOTSTRAP: kafka:29092
      LOG_JSON_PATH: /var/log/app
      DEPLOYMENT_ENV: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    volumes:
      - ../logs/debezium:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      order-service-debezium:
        condition: service_healthy

  connect:
    # 3.2.4.Final is the newest published 3.2 image with publish.via.partition.root.
    # 3.2.7.Final (Kafka Connect 3.9.1) is not on Quay.
    # The local build adds the trace interceptor on top of that image.
    image: quay.io/debezium/connect:3.2.4.Final
    pull_policy: never
    build:
      context: ./debezium
    ports:
      - "8087:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: outbox-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      OTEL_SERVICE_NAME: debezium-connect
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  connect-init:
    image: curlimages/curl:8.17.0
    depends_on:
      connect:
        condition: service_started
      order-service-debezium:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./debezium/outbox-connector.json:/connector.json:ro
      - ./debezium/outbox-connector-config.json:/connector-config.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka Connect..."
        ready=0
        for i in $$(seq 1 60); do
          if curl -sf http://connect:8083/connectors >/dev/null; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$$ready" -ne 1 ]; then
          echo "Kafka Connect did not become ready"
          exit 1
        fi
        if curl -sf http://connect:8083/connectors/outbox-events >/dev/null; then
          curl -sf -X PUT -H "Content-Type: application/json" \
            --data @/connector-config.json \
            http://connect:8083/connectors/outbox-events/config
          echo "Connector outbox-events config updated"
          exit 0
        fi
        curl -sf -X POST -H "Content-Type: application/json" \
          --data @/connector.json \
          http://connect:8083/connectors
        echo "Connector outbox-events is registered"

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: "postgresql://outbox:outbox@postgres:5432/outbox_debezium?sslmode=disable"
    ports:
      - "9190:9187"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    ports:
      - "9103:9090"
    volumes:
      - ../monitoring/prometheus/prometheus-debezium.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.3.3
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: http://grafana-image-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/grafana/provisioning/dashboards/orders-technical-dashboard.json:/etc/grafana/provisioning/dashboards/orders-technical.json:ro
      - ../monitoring/grafana/provisioning/dashboards/outbox-dashboard.json:/etc/grafana/provisioning/dashboards/outbox.json:ro
      - ../monitoring/grafana/provisioning/dashboards/postgres-dashboard.json:/etc/grafana/provisioning/dashboards/postgres.json:ro
      - ../monitoring/grafana/provisioning/dashboards/notification-stub-dashboard.json:/etc/grafana/provisioning/dashboards/notification-stub.json:ro
      - ../monitoring/grafana/provisioning/dashboards/tracing-dashboard.json:/etc/grafana/provisioning/dashboards/tracing.json:ro
    depends_on:
      - prometheus
      - tempo
      - grafana-image-renderer

  grafana-image-renderer:
    profiles: ["observability"]
    image: grafana/grafana-image-renderer:3.12.2
    ports:
      - "3194:8081"

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.8.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3203:3200"
      - "4321:4318"
    volumes:
      - ../monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  opensearch:
    profiles: ["observability"]
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9203:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    profiles: ["observability"]
    image: opensearchproject/opensearch-dashboards:2.19.2
    ports:
      - "5604:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch

  opensearch-init:
    profiles: ["observability"]
    image: curlimages/curl:8.17.0
    restart: "no"
    volumes:
      - ../monitoring/opensearch/index-template.json:/index-template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://opensearch:9200 >/dev/null; do sleep 2; done
        curl -sf -X PUT http://opensearch:9200/_index_template/spring-outbox-logs \
          -H "Content-Type: application/json" \
          -d @/index-template.json
        echo opensearch index template applied
    depends_on:
      opensearch:
        condition: service_started

  opensearch-dashboards-init:
    profiles: ["observability"]
    image: curlimages/curl:8.17.0
    restart: "no"
    volumes:
      - ../monitoring/opensearch-dashboards/saved-objects.ndjson:/saved-objects.ndjson:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://opensearch-dashboards:5601/api/status >/dev/null; do sleep 3; done
        sleep 5
        curl -sf -X POST "http://opensearch-dashboards:5601/api/saved_objects/_import?overwrite=true" \
          -H "osd-xsrf: true" \
          -F file=@/saved-objects.ndjson
        echo opensearch dashboards saved objects imported
    depends_on:
      opensearch-dashboards:
        condition: service_started

  fluent-bit:
    profiles: ["observability"]
    image: fluent/fluent-bit:3.2.10
    volumes:
      - ../logs/debezium:/var/log/app:ro
      - ../monitoring/fluent-bit/fluent-bit-debezium.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../monitoring/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      - opensearch

volumes:
  opensearch-data:
