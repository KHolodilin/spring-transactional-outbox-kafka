spring:
  application:
    name: order-service-debezium
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:outbox_debezium}
    username: ${DB_USER:outbox}
    password: ${DB_PASSWORD:outbox}
    hikari:
      maximum-pool-size: 70
      connection-timeout: 2000
      connection-init-sql: SET TIME ZONE 'UTC'
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        hikaricp.connections.acquire: 0.95, 0.99
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.kholodilin.outbox: INFO

deployment:
  environment: ${DEPLOYMENT_ENV:local}

idempotency:
  enabled: true
  persistence:
    enabled: true
    table-name: idempotency_records
    schema:
      mode: validate

app:
  instance-id: ${HOSTNAME:local-${random.uuid}}
  logging:
    json:
      enabled: true
      path: ${LOG_JSON_PATH:./logs}
  rate-limit:
    throttle-multiplier: 0.5
    usage-threshold: 0.8
    global:
      capacity: 1000
      refill-per-second: 100
    per-customer:
      capacity: 100
      refill-per-second: 10
    per-ip:
      capacity: 50
      refill-per-second: 5
  bulkhead:
    max-concurrent-creates: 55
  cdc:
    slot-name: debezium_outbox
    lag-capacity-bytes: 10485760

server:
  port: 8086
  tomcat:
    mbeanregistry:
      enabled: true
